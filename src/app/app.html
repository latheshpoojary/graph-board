<h1>This is the Entire Graph pages for live changes part 2</h1>
<span>Checking the deployed changes</span>
<ngx-graph class="chart-container" [nodes]="nodes" [links]="edge" [view]="[500,550]" layout="dagre">

</ngx-graph>

<ngx-graph class="chart-container" [view]="[500, 550]" [links]="[
    {
      id: 'a',
      source: 'first',
      target: 'second',
      label: 'is parent of'
    }, {
      id: 'b',
      source: 'first',
      target: 'c1',
      label: 'custom label'
    }, {
      id: 'd',
      source: 'first',
      target: 'c2',
      label: 'custom label'
    }, {
      id: 'e',
      source: 'c1',
      target: 'd',
      label: 'first link'
    }, {
      id: 'f',
      source: 'c1',
      target: 'd',
      label: 'second link'
    }
  ]" [nodes]="[
    {
      id: 'first',
      label: 'A'
    }, {
      id: 'second',
      label: 'B'
    }, {
      id: 'c1',
      label: 'C1'
    }, {
      id: 'c2',
      label: 'C2'
    }, {
      id: 'd',
      label: 'D'
    }
  ]" [clusters]="[
    {
      id: 'third',
      label: 'Cluster node',
      childNodeIds: ['c1', 'c2']
    }
  ]" layout="dagreCluster">
  <ng-template #defsTemplate>
    <svg:marker id="arrow" viewBox="0 -5 10 10" refX="8" refY="0" markerWidth="4" markerHeight="4" orient="auto">
      <svg:path d="M0,-5L10,0L0,5" class="arrow-head" />
    </svg:marker>
  </ng-template>

  <ng-template #clusterTemplate let-cluster>
    <svg:g class="node cluster">
      <svg:rect rx="5" ry="5" [attr.width]="cluster.dimension.width" [attr.height]="cluster.dimension.height"
        [attr.fill]="cluster.data.color" />
    </svg:g>
  </ng-template>

  <ng-template #nodeTemplate let-node>
    <svg:g (click)="onNodeClick($event)" (dblclick)="onNodeClick($event)" class="node" ngx-tooltip>
      <svg:rect [attr.width]="node.dimension.width" [attr.height]="node.dimension.height"
        [attr.fill]="node.data.color" />
      <svg:text alignment-baseline="central" [attr.x]="10" [attr.y]="node.dimension.height / 2">
        {{node.label}}
      </svg:text>
    </svg:g>
  </ng-template>

  <ng-template #linkTemplate let-link>
    <svg:g class="edge">
      <svg:path class="line" stroke-width="2" marker-end="url(#arrow)"></svg:path>
      <svg:text class="edge-label" text-anchor="middle">
        <textPath class="text-path" [attr.href]="'#' + link.id" [style.dominant-baseline]="link.dominantBaseline"
          startOffset="50%">
          {{link.label}}
        </textPath>
      </svg:text>
    </svg:g>
  </ng-template>
</ngx-graph>

<div #host class="chart-host"></div>


<form [formGroup]="form" (ngSubmit)="addItem()">

  <input type="text" placeholder="Enter the label" formControlName="label">
  <input type="number" placeholder="Enter the number" formControlName="value">
  <button>Submit</button>
</form>

<svg width="300" height="300">
  <g transform="translate(150, 150)">
    @for (slice of slices; track slice.data.label;let i = $index) {
    <path [attr.d]="arc(slice)" [attr.fill]="colors[i % colors.length]" stroke="white"
      (mouseenter)="hoverEle = slice.data.label" (mouseleave)="hoverEle = null"
      [attr.opacity]="hoverEle === null || hoverEle === slice.data.label ? 1 : 0.3" [attr.shadow]="'0px 0px 5px 5px'"
      (click)="onChartClick(slice.data)">
      <title>{{slice.data.label}}</title>
    </path>

    }
  </g>
</svg>
@for (item of data; track item.label; let i = $index) {
<div style="display: flex; align-items: center; gap: 8px;">
  <span [style.background-color]="colors[i % colors.length]" style="display: inline-block; width: 12px; height: 12px;">
  </span>
  <span>{{ item.label }}</span>
</div>
}

<p>Slice Details:</p>
<p>{{selectedSlice | json}}</p>
